 async returnHome(){if(this.busy||this.mode!=='planet')return;this.busy=true;this.input.enabled=false;this.input.clear();this.audio.stop();const wasNew=this.planet.newCapture;try{await this.ui.transition('NØMAD','에덴 상공 · 모선 귀환',()=>{this.planet.snapshot();this.planet.dispose();this.planet=null;this.mode='interior';this.descent=0;this.interior.spawn('hangar');this.ui.mode('interior');this.setEnvironment();this.persist("checkpoint");});this.ui.toast(wasNew?'전시실에 새 머리가 도착했습니다.':'다시, 고요. ',wasNew?'복도를 따라 앞으로. 첫 번째 왼쪽 진열대에 있습니다.':'원할 때 다시 내려갈 수 있습니다.',7);}catch(e){this.ui.fatal(e);}finally{this.busy=false;this.input.clear();this.input.enabled=true;}}
 persist(reason="auto"){this.space?.save();if(this.planet)this.planet.snapshot();this.save.data.settings=this.settings;this.save.write(reason)}
 frame(now){const raw=Math.max(0,(now-this.last)/1000);this.last=now;let dt=Math.min(raw,.04);this.time+=dt;try{
 if(!this.paused){if(!this.started){this.interior.syncOutside();this.engine.camera={p:[-.8,2.6,-11.5],yaw:-.19+Math.sin(this.time*.1)*.035,pitch:.035,roll:0,fov:78};}
 else if(this.mode==='interior'){this.space.update(dt,this.input,true);if(!this.busy)this.interior.update(dt,this.input);this.ui.setStatus(this.space.auto?'자동항해 중 · 선내 보행':'선내 보행','NØMAD');}
 else if(this.mode==='space'){if(!this.busy)this.space.update(dt,this.input);}
 else if(this.mode==='planet'&&this.planet){if(this.descent>0){this.input.clear();this.descent=Math.max(0,this.descent-dt);const t=1-this.descent/3.6,q=t*t*(3-2*t);const v=this.planet.vehicle;v.p=[M.lerp(25,0,q),M.lerp(125,12,q),M.lerp(300,175,q)];v.pitch=M.lerp(-.36,-.055,q);this.planet.update(dt,this.input);}else if(!this.busy)this.planet.update(dt,this.input);}
 if(this.started&&!this.busy){const speed=this.mode==='space'?M.len(this.space.velocity):this.mode==='planet'&&this.planet?M.len(this.planet.vehicle.velocity):0;this.audio.tick(dt,speed,this.mode,this.mode==='planet'&&this.planet?.vehicle.firing);}
 }
 const root=this.mode==='planet'&&this.planet?this.planet.root:this.mode==='space'?this.space.root:this.interior.root;const overlay=this.mode==='planet'&&this.planet?this.planet.vehicle.rig.root:this.mode==='space'?this.space.cockpit:null;this.engine.render(root,this.time,overlay);this.ui.update();if(this.started&&!this.paused)this.labels();this.input.end();this.saveElapsed+=dt;if(this.saveElapsed>12){this.saveElapsed=0;this.persist();}this.frameTimes.push(raw);if(this.frameTimes.length>60)this.frameTimes.shift();this.fps=1/(this.frameTimes.reduce((a,b)=>a+b,0)/this.frameTimes.length||.016);this.qualityTimer+=raw;if(this.qualityTimer>4&&!this.paused&&!this.busy){this.qualityTimer=0;if(this.settings.quality==='balanced'&&this.fps<26&&this.engine.resolutionScale>.62){this.engine.resolutionScale=Math.max(.62,this.engine.resolutionScale-.12);this.engine.resize();}}if(this.debugMode)this.debugOverlay();
 }catch(e){console.error(e);this.paused=true;this.audio.stop();this.ui.fatal(e);return;}requestAnimationFrame(t=>this.frame(t));}
 labels(){const root=document.getElementById('worldLabels');if(this.mode!=='interior'){if(root.childElementCount)root.innerHTML='';return;}let items=[{id:'bridge',p:[0,4.6,-13],en:'01 / BRIDGE',ko:'조종실'},{id:'gallery',p:[-7.6,4.3,-3.5],en:'02 / ARCHIVE',ko:'트로피실'},{id:'hangar',p:[0,4.9,15],en:'03 / HANGAR',ko:'격납고'}];if(root.childElementCount!==3){root.innerHTML=items.map(i=>`<div class="worldLabel" id="lbl-${i.id}">${i.en}<span>${i.ko}</span></div>`).join('')}for(const i of items){const p=M.project(i.p,this.engine.vp,innerWidth,innerHeight);const el=document.getElementById('lbl-'+i.id);const dist=M.dist(this.engine.camera.p,i.p);el.style.display=p.front&&dist<34&&p.x>50&&p.x<innerWidth-50&&p.y>85&&p.y<innerHeight-100?'':'none';el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity=M.clamp(1-dist/45,.15,.75)}}
 setupDebug(){const g=this;window.__KO__={game:g,snapshot:()=>({mode:g.mode,started:g.started,paused:g.paused,busy:g.busy,position:g.mode==='planet'?g.planet?.vehicle.p:g.mode==='space'?g.space.position:g.interior.position,nearPlanet:g.nearPlanet(),distance:g.space.distance(),atmosphere:g.space.atmosphere(),autopilot:g.space.auto,trophies:g.save.data.trophies.length,buildings:g.planet?.buildings.filter(x=>x.alive).length,destroyed:g.planet?.destroyed.size,creatures:g.planet?.creatures.filter(x=>x.alive).length,ruler:g.planet?{hp:g.planet.ruler.hp,captured:g.planet.ruler.captured,grabbing:g.planet.vehicle.grab?.kind,tension:g.planet.vehicle.tension}:null,geometries:Object.keys(g.engine.geometries).length,drawCalls:g.engine.drawCalls,triangles:g.engine.triangles,fps:Math.round(g.fps)}),goto:async mode=>{if(!g.started)g.start();document.exitPointerLock?.();if(mode==='planet'){await g.launch(true);g.descent=0;g.planet.vehicle.p=[0,12,175];}else if(mode==='space')g.enterSpace();else g.enterInterior('bridge')},aim:p=>{let v=g.mode==='planet'?g.planet.vehicle:g.mode==='space'?g.space:g.interior;const a=M.aim(v.p||v.position,p);v.yaw=a.yaw;v.pitch=a.pitch;},downloadSave:()=>g.save.export()};document.getElementById('debug').classList.remove('hidden');}
 debugOverlay(){const s=window.__KO__.snapshot();document.getElementById('debug').textContent=`${s.mode} / ${s.fps} FPS\n${s.drawCalls} draws / ${Math.round(s.triangles/1000)}k tris\n${s.geometries} geometry buffers\nP ${s.position?.map(x=>x.toFixed(1)).join(', ')}\n${s.destroyed??0} buildings / ${s.trophies} trophies`;}
}
K.Game=Game;
function fatal(e){console.error(e);document.getElementById('loading')?.classList.add('hidden');document.getElementById('fatal')?.classList.remove('hidden');const text=document.getElementById('fatalText');if(text)text.textContent=String(e?.message||e)}
window.addEventListener('unhandledrejection',e=>fatal(e.reason));
try{new Game()}catch(e){fatal(e)}
})(window.KO ||= {});

</script></body></html>
