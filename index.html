.planetCard{background:#0a161e;border:1px solid #c2dcd71c;padding:11px 12px;display:flex;gap:12px;align-items:center;text-align:left;min-width:0}.planetCard.selected{border-color:#dcb682aa;background:#2c2e282e}.planetCard:hover{background:#a2c4b910}.planetCard b{font-size:12px;font-weight:500;display:block}.planetCard small{font-size:9px;line-height:1.6;display:block;color:#829a98;margin-top:3px}.planetCard>span:nth-child(2){flex:1}.planetCard em{font-size:22px;font-style:normal;color:#986f5f}.planetCard.annihilated b{color:#929b9d}.planetCard.annihilated .planetSwatch{opacity:.35;clip-path:polygon(0 0,38% 0,50% 36%,67% 5%,100% 0,100% 100%,61% 100%,46% 63%,24% 100%,0 100%)}
.planetSwatch{width:31px;height:31px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 25% 30%,var(--planet),#030910 95%);box-shadow:1px 1px 12px #5b82961c}.planetSwatch.kind-5{background:repeating-linear-gradient(12deg,transparent 0 3px,#0002 3px 6px),radial-gradient(circle at 20% 30%,var(--planet),#090d1b 93%)}
.atlasDetail{margin:16px 0 0;padding:13px 0;border-block:1px solid var(--line)}.atlasDetail>div:first-child{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.atlasDetail strong{font-size:15px;font-weight:400}.atlasDetail span{font-size:10px;color:#869c9c}.atlasDetail p{font-size:11px;line-height:1.6;color:#adc0b6;margin:10px 0}.atlasDetail .lostText{color:#c6967b}
.fractureDots{display:flex;gap:5px}.fractureDots i{display:block;width:28px;height:2px;background:#6b7c7c55}.fractureDots i.on{background:#e8a466}
.atlasActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.atlasActions .primary{font-size:12px;min-width:190px;padding:13px 18px}.atlasActions .secondary{font-size:11px;padding:12px}.atlasActions .ghost{font-size:11px;margin-left:auto}

#arcadeFace{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  right:max(16px,env(safe-area-inset-right));
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  touch-action:manipulation;
  border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
#arcadeFace svg{width:36px;height:36px;filter:drop-shadow(0 0 1.5px #eff1ec) drop-shadow(0 2px 2px #0008)}
#arcadeFace:hover svg{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 2px 2px #0008)}
#arcadeFace:active svg{transform:scale(.92)}
#arcadeFace:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* FIRST CONTACTS — no translated title, no tagline. Interface remains Korean. */
#titleContent{max-width:min(760px,90vw)}
#title h1{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(46px,6.6vw,94px);font-weight:300;letter-spacing:-.047em;line-height:.96;margin:0 0 40px;white-space:nowrap}
#title h1 span{color:inherit;font-weight:300}
.contactMark{position:relative;width:46px;height:24px;margin:0 0 37px}
.contactMark i{position:absolute;top:0;width:23px;height:23px;border:1px solid #a7c3c3;border-radius:50%}
.contactMark i:first-child{left:0}.contactMark i:last-child{left:19px}
.surfaceLinks{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px;pointer-events:auto}
.surfaceLinks button{background:transparent;border:1px solid var(--line);padding:8px 12px;font-size:10px;letter-spacing:1px;color:#b3ccc5}
.surfaceLinks button.active{border-color:var(--gold);color:#e4c7a6}.surfaceLinks button.lost{opacity:.5;text-decoration:line-through}
@media(max-width:600px){#title h1{font-size:clamp(42px,10.6vw,64px);letter-spacing:-.04em;margin-bottom:29px}.contactMark{margin-bottom:25px}.surfaceLinks button{padding:8px 10px}.titleFoot{letter-spacing:.5px}}

#transition.show{pointer-events:auto}

<script>
/* Loads manifest.js fresh every time, then the files it names (core, planets, main) in order. */
(function () {
  'use strict';
  function fail(msg) {
    (window.KO = window.KO || {}).LoadError = msg;
    var l = document.getElementById('loading');
    if (l) l.classList.add('hidden');
    var f = document.getElementById('fatal');
    if (f) f.classList.remove('hidden');
    var t = document.getElementById('fatalText');
    if (t) t.textContent = msg;
  }
  function load(src, name, done) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    s.onerror = function () {
      fail(name + ' 파일을 불러오지 못했습니다. 저장소에 ' + name + ' 파일이 올라가 있는지 확인해 주세요.');
    };
    if (done) s.onload = done;
    document.body.appendChild(s);
  }
  load('manifest.js?t=' + Date.now(), 'manifest.js', function () {
    var K = window.KO || {};
    if (!K.SurfaceFiles) return fail('manifest.js 내용이 올바르지 않습니다. 같은 판의 manifest.js로 다시 올려 주세요.');
    var b = document.getElementById('buildNo');
    if (b) b.textContent = K.BUILD || '';
    var v = encodeURIComponent(K.BUILD || String(Date.now()));
    var files = ['core.js'];
    for (var id in K.SurfaceFiles) files.push(K.SurfaceFiles[id]);
    files.push('main.js');
    files.forEach(function (f) { load(f + '?v=' + v, f); });
  });
})();
</script>
